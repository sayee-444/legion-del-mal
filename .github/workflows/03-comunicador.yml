
name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envia el mensaje?"
        required: true
        type: choice
          - Lex Luthor
          - Brainiac
          - Darkseid
          - Joker
          - Bizarro
          - Mystique
          
      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Critica

      mensaje: 
        description: "Mensaje para el consejo de la legion"
        required: true
        default: "La mision fue un exito"

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
