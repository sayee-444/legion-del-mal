# Spiderman

Spiderman es un superhéroe ficticio creado por el escritor Stan Lee y el dibujante Steve Ditko para la editorial Marvel Comics. Su primera aparición fue en "Amazing Fantasy" #15 en 1962. El personaje es conocido por su agilidad, fuerza sobrehumana, capacidad de trepar paredes y su sentido arácnido que le alerta del peligro. Su identidad secreta es Peter Parker, un joven estudiante que adquiere sus poderes tras ser mordido por una araña radiactiva. Spiderman lucha contra diversos villanos mientras equilibra su vida personal y sus responsabilidades como héroe.

## Enemigos

1. Duende Verde (Green Goblin): Uno de los enemigos más icónicos de Spiderman, conocido por su locura y su arsenal de armas avanzadas.
2. Doctor Octopus (Dr. Otto Octavius): Un científico brillante con brazos mecánicos que le otorgan fuerza y habilidades sobrehumanas.
3. Venom (Eddie Brock): Un simbionte alienígena que se une
4. Sandman (Flint Marko): Un criminal que puede transformarse en arena, lo que le permite cambiar de forma y tamaño.
5. Lagarto (Dr. Curt Connors): Un científico que se transforma en un lagarto gigante debido a un experimento fallido, convirtiéndose en un enemigo formidable para Spiderman.

## Peliculas

1. Spider-Man: Homecoming (2017): Dirigida por Jon Watts, esta película sigue a Peter Parker mientras intenta equilibrar su vida como estudiante y superhéroe, enfrentándose al villano Vulture.
2. Spider-Man: Far From Home (2019): Continuación de "Homecoming", donde Peter Parker viaja a Europa y se enfrenta a Mysterio, un villano que utiliza ilusiones para engañar al
  mundo.
3. Spider-Man: No Way Home (2021): En esta película, Peter Parker enfrenta las consecuencias de su identidad revelada y se encuentra con villanos de diferentes universos, incluyendo a Doctor Octopus y Green Goblin.
4. Spider-Man: Into the Spider-Verse (2018): Una película animada que explora el concepto del multiverso, presentando a varios Spidermen de diferentes dimensiones, incluyendo a Miles Morales y Peter B. Parker.
5. Spider-Man (2002): Dirigida por Sam Raimi, esta película sigue los orígenes de Peter Parker y su transformación en Spiderman, enfrentándose al villano Green Goblin.
