name: Control de calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  revision-de-calidad:
    runs-on: ubuntu-latest
    
    steps:
      - name: Brainiac accede a la base
        uses: actions/checkout@v4
      - name: El consejo revisa los cambios
        run: |
          chmod +x scripts/validar-planes.sh
          ./scripts/validar-planes.sh