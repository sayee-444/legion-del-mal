name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Brainiac
          - Darkseid
          - Joker
          - Bizarro
          - Mystique

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Critica

      mensaje:
        description: "Mensaje para el consejo de la legion"
        required: true
        type: string
        default: "La mision fue un exito"

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:

      - name: Instalar el transmisor de la legion
        run: |
          sudo apt-get install -y cowsay

      - name: "imprimir inputs"
        run: |
          echo "==========================================="
          echo "  Transmision interceptada  "
          echo "==========================================="
          echo ""
          echo "De: ${{inputs.villano}}"
          echo ""
          echo "Fecha: $(date -u +%d/%m/%Y\ %H:%M:%S UTC)"
          echo "------ Mensaje ------"
          cowsay -f  eyes ${{inputs.mensaje}}
          echo ""
          echo "--- ${{inputs.villano}} ---"
          echo "..."
